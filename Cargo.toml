[package]
name = "forge"
version = "0.2.0"
edition = "2024"
description = "Interactive developer environment setup CLI"
license = "MIT"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
clap      = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
indicatif = "0.18"
colored   = "3"
which     = "8"
anyhow    = "1"
